<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatCalc Pro - Calculadora de Estadística Descriptiva</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Librería para exportación a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Librería para exportación a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- OCR Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-dark text-light">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <h2>📊 StatCalc <span>Pro</span></h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="nav-inicio"><span>🏠</span> Inicio</a>
                <a href="#" class="nav-item" id="nav-projects"><span>📁</span> Proyectos</a>
                <a href="#" class="nav-item" id="nav-history"><span>📜</span> Historial</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header-bar glass-panel">
                <h1>Calculadora de Estadística Descriptiva</h1>
                <div class="header-actions">
                    <button class="btn btn-google" id="btn-login-google">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width:16px; margin-right:8px;">
                        <span id="auth-label">Iniciar Sesión</span>
                    </button>
                    <button class="btn-avatar hidden" id="btn-user-avatar">
                        <img src="" id="user-photo" alt="Perfil">
                    </button>
                </div>
            </header>

            <section class="calculator-container" style="padding: 20px;">
                <div class="grid-form">
                    <div class="glass-card form-step">
                        <h3>Entrada de Datos</h3>
                        <input type="text" id="project-name-input" class="glass-input" placeholder="Nombre del proyecto (Ej. Ejercicio 1)" style="margin-bottom: 12px;">
                        <textarea id="data-input" class="glass-input" rows="5" placeholder="Ingresa datos separados por comas o espacios. Ej: 10, 15, 20, 25"></textarea>
                        
                        <div style="margin-top: 15px; display: flex; gap: 10px;">
                            <button id="btn-calcular" class="btn btn-primary">Calcular</button>
                            <button id="btn-save-project" class="btn btn-secondary">Guardar</button>
                            <button id="btn-limpiar" class="btn btn-secondary">Limpiar</button>
                        </div>
                    </div>

                    <div class="glass-card form-step">
                        <h3>Medidas opcionales</h3>
                        <div class="checklist-container">
                            <label><input type="checkbox" id="chk-varianza" value="varianza"> Varianza / Desviación $(x_i - \bar{x})^2$</label>
                            <label><input type="checkbox" id="chk-asimetria" value="asimetria"> Asimetría Fisher $(x_i - \bar{x})^3$</label>
                            <label><input type="checkbox" id="chk-kurtosis" value="kurtosis"> Curtosis $(x_i - \bar{x})^4$</label>
                        </div>
                    </div>
                </div>

                <!-- Resultados -->
                <div id="results-section" class="results-container" style="margin-top: 25px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h2>Resultados</h2>
                        <div class="dropdown-export">
                            <button class="btn btn-primary" id="btn-export-main">Descargar ▼</button>
                            <div class="dropdown-content hidden" id="dropdown-menu">
                                <a href="#" id="btn-export-pdf">Exportar PDF</a>
                                <a href="#" id="btn-export-excel">Exportar Excel</a>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla de Frecuencias -->
                    <div class="glass-card" style="padding: 20px; margin-top: 20px;">
                        <h3>Tabla de Frecuencias</h3>
                        <div id="table-wrapper">
                            <!-- La tabla se renderiza dinámicamente -->
                        </div>
                    </div>

                    <!-- Grid de Tarjetas (Resumen Estadístico) -->
                    <div id="cards-grid" class="cards-grid" style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- AI Chat Widget -->
    <div class="ai-chat-widget">
        <button id="btn-toggle-chat" class="ai-fab-btn">🤖</button>
        <div id="ai-chat-window" class="ai-chat-window hidden">
            <div class="chat-header">
                <span>Asistente IA</span>
                <button id="btn-close-chat" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div id="ai-typing-indicator" class="typing-indicator hidden">Procesando...</div>
            <div class="chat-input-area">
                <label for="chat-file-input" class="btn-icon-attach" title="Adjuntar imagen/archivo">📎</label>
                <input type="file" id="chat-file-input" class="hidden" accept="image/*,.txt,.csv" style="display:none;">
                <input type="text" id="chat-input" placeholder="Escribe o pide un cálculo...">
                <button id="btn-send-chat" class="btn btn-primary">Enviar</button>
            </div>
        </div>
    </div>

    <!-- User Profile Modal -->
    <div id="user-modal" class="modal-overlay hidden">
        <div class="profile-card-redesigned">
            <button id="btn-close-modal" class="modal-close-btn">✕</button>
            <div class="profile-banner"></div>
            <div class="profile-avatar-wrapper">
                <img src="" id="modal-user-img" class="profile-avatar-lg" alt="Usuario">
            </div>
            <div class="profile-body">
                <h2 id="modal-user-name">Usuario</h2>
                <p id="modal-user-email">email@ejemplo.com</p>
                <div class="profile-badges">
                    <span class="badge-premium">Pro Member</span>
                    <span class="badge-status">Activo</span>
                </div>
                <div class="profile-stats-mini">
                    <div>
                        <strong id="stat-count-projects">0</strong>
                        <span>Proyectos</span>
                    </div>
                    <div>
                        <strong id="stat-count-calcs">0</strong>
                        <span>Cálculos</span>
                    </div>
                </div>
                <button id="btn-logout" class="btn btn-danger" style="margin-top: 20px; width: 100%; justify-content: center;">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="statsEngine.js"></script>
    <script src="aiChat.js"></script>
    <script src="app.js"></script>
</body>
</html>
