<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatCalc Pro - Calculadora de Estadística Descriptiva</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Librería para exportación a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Librería para exportación a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- OCR Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <h2>📊 StatCalc <span>Pro</span></h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active"><span>🏠</span> Inicio</a>
                <a href="#" class="nav-item"><span>📁</span> Proyectos</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header-bar glass-panel">
                <h1>Calculadora de Estadística Descriptiva</h1>
                <div class="header-actions">
                    <button class="btn-google" id="btn-login">Iniciar Sesión</button>
                </div>
            </header>

            <section class="calculator-container">
                <div class="grid-form">
                    <div class="glass-card form-step">
                        <h3>Entrada de Datos</h3>
                        <textarea id="data-input" class="glass-input" rows="5" placeholder="Ingresa datos separados por comas. Ej: 10, 15, 20, 25"></textarea>
                        <button id="btn-calcular" class="btn btn-primary" style="margin-top: 15px;">Calcular</button>
                    </div>

                    <div class="glass-card form-step">
                        <h3>Medidas opcionales</h3>
                        <div class="checklist-container">
                            <label><input type="checkbox" id="chk-varianza" class="chk-medida" value="varianza"> Varianza / Desviación</label>
                            <label><input type="checkbox" id="chk-asimetria" class="chk-medida" value="asimetria"> Asimetría (Fisher)</label>
                            <label><input type="checkbox" id="chk-kurtosis" class="chk-medida" value="kurtosis"> Curtosis</label>
                        </div>
                    </div>
                </div>

                <!-- Resultados -->
                <div id="results-section" class="results-container style="margin-top:25px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h2>Resultados</h2>
                        <div class="dropdown-export">
                            <button class="btn btn-primary">Descargar ▼</button>
                            <div class="dropdown-content">
                                <a href="#" id="btn-export-pdf">Exportar PDF</a>
                                <a href="#" id="btn-export-excel">Exportar Excel</a>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla de Frecuencias -->
                    <div class="glass-card" style="padding: 20px; margin-top:20px;">
                        <h3>Tabla de Frecuencias</h3>
                        <div id="table-wrapper">
                            <!-- La tabla se renderiza dinámicamente -->
                        </div>
                    </div>

                    <!-- Grid de Tarjetas -->
                    <div id="cards-grid" class="cards-grid"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- AI Chat Widget -->
    <div class="ai-chat-widget">
        <button id="btn-toggle-chat" class="ai-fab-btn">🤖</button>
        <div id="ai-chat-window" class="ai-chat-window hidden">
            <div class="chat-header">
                <span>Asistente IA</span>
                <button id="btn-close-chat" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div id="ai-typing-indicator" class="typing-indicator hidden">Procesando...</div>
            <div class="chat-input-area">
                <label for="chat-file-input" class="btn-icon-attach">📎</label>
                <input type="file" id="chat-file-input" class="hidden" accept="image/*,.txt,.csv">
                <input type="text" id="chat-input" placeholder="Escribe o pide un cálculo...">
                <button id="btn-send-chat" class="btn btn-primary">Enviar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="statsEngine.js"></script>
    <script src="aiChat.js"></script>
    <script src="app.js"></script>
</body>
</html>
